// =============================================================
// THE GREAT WATERFALL — a full-width cascade into its plunge pool
// =============================================================
function updateWaterfall(dt) {
  const wf = world.waterfall;
  if (!wf) return;
  const p = player;
  // the curtain shoves you downward
  if (p.x + CFG.playerW > wf.x * T && p.x < (wf.x + wf.w) * T &&
      p.y + CFG.playerH > wf.top * T && p.y < wf.bot * T &&
      !p.hanging && !p.climbing) {
    p.vy = Math.min(p.vy + 500 * dt, p.inWater ? 120 : CFG.maxFall);
  }
  // mist boils off the pool
  if (Math.random() < 0.35 && particles.length < CFG.maxParticles - 10) {
    spawnParticle({
      type: 'mist',
      x: wf.x * T + Math.random() * wf.w * T,
      y: wf.bot * T - 2,
      vx: (Math.random() - 0.5) * 50,
      vy: -30 - Math.random() * 50,
      life: 0.7,
    });
  }
}

function drawWaterfall(g, time, camIX, camIY) {
  const wf = world.waterfall;
  if (!wf) return;
  const x0 = wf.x * T - camIX, y0 = wf.top * T - camIY;
  const wpx = wf.w * T, hpx = (wf.bot - wf.top) * T;
  if (x0 > CFG.VIEW_W || x0 + wpx < 0 || y0 > CFG.VIEW_H || y0 + hpx < 0) return;
  g.globalAlpha = 0.16;                                  // the sheet
  g.fillStyle = PAL.waterTint;
  g.fillRect(x0, y0, wpx, hpx);
  g.globalAlpha = 0.35;                                  // scrolling streaks
  g.fillStyle = PAL.waterLine;
  const scroll = (time * 240) % 26;
  for (let sx = 0; sx < wf.w; sx++) {
    const px = x0 + sx * T + 2 + ((sx * 7) % 9);
    for (let k = -1; k < hpx / 26 + 1; k++) {
      const py = y0 + k * 26 + scroll + ((sx * 13) % 19);
      const top = Math.max(py, y0), bot = Math.min(py + 15, y0 + hpx);
      if (bot > top) g.fillRect(px, top, 3, bot - top);
    }
  }
  g.globalAlpha = 0.45 + 0.1 * Math.sin(time * 6);       // foam at the plunge
  g.fillStyle = '#ffffff';
  for (let sx = 0; sx < wf.w; sx++) {
    g.fillRect(x0 + sx * T + 1, y0 + hpx - 2 + ((sx * 5) % 3), 11, 3);
  }
  g.globalAlpha = 1;
}

// =============================================================
// THE VOLCANO — erupts on a timer; the bombs are not decorative
// =============================================================
function updateVolcano(dt) {
  const v = world.volcano;
  if (!v) return;
  v.t -= dt;
  if (v.t <= 0) { // eruption — a full-throated one
    v.t = 3 + Math.random() * 1.5;
    const ox = v.craterX * T, oy = v.craterY * T;
    for (let i = 0; i < 30; i++) {
      world.bombs.push({
        x: ox + Math.random() * 16 - 4,
        y: oy - 2,
        vx: (Math.random() - 0.5) * 280,
        vy: -260 - Math.random() * 220,
        life: 5,
      });
    }
  }
  // ember sputter between eruptions
  if (Math.random() < 0.5 && particles.length < CFG.maxParticles - 10) {
    spawnParticle({
      type: 'spore', hint: 0,
      x: v.craterX * T + Math.random() * 16 - 4,
      y: v.craterY * T - 2,
      vy: -(20 + Math.random() * 30),
      phase: Math.random() * 6.3, size: 2, life: 1.2,
    });
  }
}

function updateBombs(dt) {
  const p = player;
  for (let i = world.bombs.length - 1; i >= 0; i--) {
    const b = world.bombs[i];
    b.vy += 700 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    const t = tileAt(Math.floor(b.x / T), Math.floor(b.y / T));
    if (b.life <= 0 || t === STONE || (t === WATER && b.vy > 0)) {
      for (let k = 0; k < 6; k++) {
        spawnParticle({ type: 'splash', x: b.x, y: b.y - 2, vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 60, life: 0.35 });
      }
      world.bombs.splice(i, 1);
      continue;
    }
    if (!transition && !winState &&
        p.x < b.x + 5 && p.x + CFG.playerW > b.x - 5 &&
        p.y < b.y + 5 && p.y + CFG.playerH > b.y - 5) {
      world.bombs.splice(i, 1);
      hazardDeath();
    }
  }
}

function drawBombs(g, camIX, camIY) { // drawn above the darkness: molten rock glows
  for (const b of world.bombs) {
    const sx = Math.round(b.x - camIX), sy = Math.round(b.y - camIY);
    if (sx < -10 || sx > CFG.VIEW_W + 10 || sy < -10 || sy > CFG.VIEW_H + 10) continue;
    g.fillStyle = '#ff6a26';
    g.fillRect(sx - 3, sy - 3, 6, 6);
    g.fillStyle = '#ffcf7d';
    g.fillRect(sx - 1, sy - 1, 3, 3);

}

// =============================================================
// THE KEY — glints in the dark; the black door won't open without it
// =============================================================
function keyPos(time) {
  const k = world.key;
  return { x: k.x * T + 8, y: k.y * T + 8 + Math.sin(time * 2) * 3 };
}

function updateKey(time) {
  const k = world.key;
  if (!k || k.taken || transition || winState) return;
  const { x, y } = keyPos(time);
  if (player.x < x + 6 && player.x + CFG.playerW > x - 6 &&
      player.y < y + 6 && player.y + CFG.playerH > y - 6) {
    k.taken = true;
    for (let i = 0; i < 14; i++) {
      spawnParticle({ type: 'spore', hint: 0, x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10, vy: -14 - Math.random() * 24, phase: Math.random() * 6.3, size: 2, life: 1.1 });
    }
  }
}

function drawKey(g, time, camIX, camIY) { // drawn above the darkness: it glints
  const k = world.key;
  if (!k || k.taken) return;
  const { x, y } = keyPos(time);
  const sx = Math.round(x - camIX), sy = Math.round(y - camIY);
  if (sx < -20 || sx > CFG.VIEW_W + 20 || sy < -20 || sy > CFG.VIEW_H + 20) return;
  g.globalAlpha = 0.22 + 0.14 * Math.sin(time * 3);
  g.fillStyle = '#ffe88a';
  g.fillRect(sx - 8, sy - 8, 16, 16);            // halo
  g.globalAlpha = 1;
  g.fillStyle = '#ffd44a';
  g.fillRect(sx - 6, sy - 3, 6, 6);              // bow
  g.fillStyle = '#8a6d1a';
  g.fillRect(sx - 4, sy - 1, 2, 2);              // bow hole
  g.fillStyle = '#ffd44a';
  g.fillRect(sx, sy - 1, 7, 2);                  // shaft
  g.fillRect(sx + 3, sy + 1, 2, 2);              // teeth
  g.fillRect(sx + 6, sy + 1, 2, 3);
}

// =============================================================
// CRABS — goomba-hearted floor patrollers
// =============================================================
function updateCrabs(dt, time) {
  const p = player;
  for (const c of world.crabs) {
    if (c.dead) continue;
    if (c.squash > 0) {
      c.squash -= dt;
      if (c.squash <= 0) c.dead = true;
      continue;
    }
    // patrol: turn at walls, ledges, and water
    const nx = c.x + c.dir * CFG.crabSpeed * dt;
    const frontX = c.dir > 0 ? nx + 14 : nx;
    const ftx = Math.floor(frontX / T);
    const bodyTy = Math.floor((c.y + 5) / T);
    const floorTy = Math.floor((c.y + 11) / T);
    if (isSolid(ftx, bodyTy) || !isSolid(ftx, floorTy) || tileAt(ftx, bodyTy) === WATER) {
      c.dir *= -1;
    } else {
      c.x = nx;
    }
    // player contact
    if (transition || winState) continue;
    if (p.hanging) {
      // hanging tucks your body against the wall — but your hand is on the lip,
      // and a crab scuttling over it kicks you off
      const hx = p.hangDir > 0 ? p.x + CFG.playerW : p.x - 5;
      const hy = p.y - 2;
      if (hx < c.x + 14 && hx + 5 > c.x && hy < c.y + 10 && hy + 6 > c.y) {
        p.hanging = false;
        p.hangCd = 0.5;                 // fingers smart for a moment — no instant regrab
        p.vx = -p.hangDir * 160;        // shoved off the wall
        p.vy = 130;
        for (let i = 0; i < 4; i++) {
          spawnParticle({ type: 'splash', x: hx + 2, y: hy, vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 50, life: 0.3 });
        }
      }
      continue;
    }
    const yOverlap = p.y < c.y + 10 && p.y + CFG.playerH > c.y;
    const overlap = yOverlap && p.x < c.x + 14 && p.x + CFG.playerW > c.x;
    // stomps get a slightly wider box than lethal contact — forgiving landings
    const stompOverlap = yOverlap && p.x < c.x + 14 + CFG.crabStompPad &&
                         p.x + CFG.playerW > c.x - CFG.crabStompPad;
    if (p.vy > 60 && p.y + CFG.playerH < c.y + 7 && stompOverlap) { // stomped from above
      c.squash = 0.35;
      p.vy = CFG.crabBounce;
      continue;
    }
    if (!overlap) continue;
    if (p.dashTimer > 0) { // dashed straight through it
      c.squash = 0.35;
      continue;
    }
    // side contact: the crab gets you — red pulse, back to the level start
    hazardDeath();
    return;
  }
}

function drawCrabs(g, time, camIX, camIY) {
  for (const c of world.crabs) {
    if (c.dead) continue;
    const sx = Math.round(c.x - camIX), sy = Math.round(c.y - camIY);
    if (sx < -20 || sx > CFG.VIEW_W + 20 || sy < -20 || sy > CFG.VIEW_H + 20) continue;
    if (c.squash > 0) { // flattened
      g.globalAlpha = c.squash / 0.35;
      g.fillStyle = '#a33827';
      g.fillRect(sx, sy + 7, 14, 3);
      g.globalAlpha = 1;
      continue;
    }
    const scuttle = Math.sin(time * 12 + c.x * 0.2) > 0 ? 1 : 0;
    g.fillStyle = '#a33827';                        // claws + legs
    g.fillRect(sx - 2, sy + 2, 3, 3);
    g.fillRect(sx + 13, sy + 2, 3, 3);
    g.fillRect(sx + (scuttle ? 1 : 2), sy + 8, 3, 2);
    g.fillRect(sx + 6, sy + 8, 2, 2);
    g.fillRect(sx + (scuttle ? 10 : 9), sy + 8, 3, 2);
    g.fillStyle = '#e85d4a';                        // shell
    g.fillRect(sx + 1, sy + 2, 12, 6);
    g.fillRect(sx + 3, sy, 8, 3);
    g.fillStyle = '#ffffff';                        // eyes on stalks
    g.fillRect(sx + 4, sy - 1, 2, 3);
    g.fillRect(sx + 8, sy - 1, 2, 3);
    g.fillStyle = '#1a0d0a';
    g.fillRect(sx + 4 + (c.dir > 0 ? 1 : 0), sy - 1, 1, 2);
    g.fillRect(sx + 8 + (c.dir > 0 ? 1 : 0), sy - 1, 1, 2);
  }
}

// =============================================================
// CAMERA
// =============================================================
const cam = { x: 0, y: 0 };
function clampCam() {
  cam.x = Math.max(0, Math.min(W * T - CFG.VIEW_W, cam.x));
  cam.y = Math.max(0, Math.min(H * T - CFG.VIEW_H, cam.y));
}
function updateCamera(dt) {
  const tx = player.x + CFG.playerW / 2 - CFG.VIEW_W / 2;
  const ty = player.y + CFG.playerH / 2 - CFG.VIEW_H / 2;
  const k = 1 - Math.pow(0.001, dt);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  clampCam();
}

// =============================================================
// PARTICLES
// =============================================================
const particles = [];
function spawnParticle(p) {
  if (particles.length < CFG.maxParticles) {
    p.age = 0;
    particles.push(p);
  }
}

function updateParticles(dt, time, camIX, camIY) {
  // drips fire from visible drip points
  const tx0 = (camIX / T | 0) - 2, tx1 = ((camIX + CFG.VIEW_W) / T | 0) + 2;
  const ty0 = (camIY / T | 0) - 2, ty1 = ((camIY + CFG.VIEW_H) / T | 0) + 2;
  for (const d of world.dripPoints) {
    if (d.x < tx0 || d.x > tx1 || d.y < ty0 || d.y > ty1) continue;
    if (time > d.next) {
      d.next = time + 2 + Math.random() * 4;
      spawnParticle({ type: 'drip', x: d.x * T + 6 + Math.random() * 4, y: d.y * T + 1, vy: 0, life: 6 });
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    let dead = p.age > p.life;

    if (p.type === 'spore') {
      p.x += (Math.sin(time * 0.8 + p.phase) * 6 + (p.hint || 0) * 9) * dt;
      p.y += p.vy * dt;
      if (tileAt(p.x / T | 0, p.y / T | 0) === STONE) dead = true;
    } else if (p.type === 'drip') {
      if (p.age > 0.4) { // cling, then fall
        p.vy = Math.min(p.vy + CFG.gravity * dt, CFG.maxFall);
        p.y += p.vy * dt;
        const t = tileAt(p.x / T | 0, p.y / T | 0);
        if (t === STONE || t === WATER) {
          dead = true;
          for (let s = 0; s < 3; s++) {
            spawnParticle({ type: 'splash', x: p.x, y: p.y - 2, vx: (Math.random() - 0.5) * 60, vy: -40 - Math.random() * 40, life: 0.3 });
          }
        }
      }
    } else if (p.type === 'splash') {
      p.vy += CFG.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    } else if (p.type === 'bubble') {
      p.y += p.vy * dt;
      p.x += Math.sin(time * 4 + p.y * 0.1) * 8 * dt;
      if (tileAt(p.x / T | 0, p.y / T | 0) !== WATER) dead = true; // pop at surface
    } else if (p.type === 'mist') {
      p.vy += 160 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    if (dead) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
    }
  }
}

function drawParticles(g, camIX, camIY, glowLayer) {
  for (const p of particles) {
    const isGlow = p.type === 'spore';
    if (isGlow !== glowLayer) continue;
    const sx = p.x - camIX, sy = p.y - camIY;
    if (sx < -4 || sx > CFG.VIEW_W + 4 || sy < -4 || sy > CFG.VIEW_H + 4) continue;
    if (p.type === 'spore') {
      g.globalAlpha = Math.sin(Math.PI * p.age / p.life) * 0.8;
      g.fillStyle = p.hint ? PAL.hintSpore : PAL.spore;
      g.fillRect(sx, sy, p.size, p.size);
    } else if (p.type === 'drip') {
      g.globalAlpha = 0.9;
      g.fillStyle = PAL.waterLine;
      const stretch = p.age < 0.4 ? 1 + p.age * 5 : 3;
      g.fillRect(sx, sy, 1, stretch);
    } else if (p.type === 'splash') {
      g.globalAlpha = 0.8 * (1 - p.age / p.life);
      g.fillStyle = PAL.waterLine;
      g.fillRect(sx, sy, 1, 1);
    } else if (p.type === 'bubble') {
      g.globalAlpha = 0.6;
      g.fillStyle = PAL.bubble;
      g.fillRect(sx, sy, 2, 2);
    } else if (p.type === 'mist') { // waterfall spray
      g.globalAlpha = Math.max(0, 1 - p.age / p.life) * 0.45;
      g.fillStyle = '#e8f6fc';
      g.fillRect(sx, sy, 2, 2);
    } else if (p.type === 'ghost') { // dash afterimage
      g.globalAlpha = Math.max(0, 1 - p.age / p.life) * 0.35;
      g.fillStyle = PAL.body;
      g.fillRect(sx, sy, CFG.playerW, CFG.playerH);
    }
  }
  g.globalAlpha = 1;
}

// =============================================================
// FLORA DRAWING (animated, per frame)
// =============================================================
function drawFlora(g, time, dt, camIX, camIY) {
  const x0 = Math.max(0, (camIX / T | 0) - 2);
  const x1 = Math.min(W - 1, ((camIX + CFG.VIEW_W) / T | 0) + 2);
  const y0 = camIY / T - 3, y1 = (camIY + CFG.VIEW_H) / T + 3;

  for (let x = x0; x <= x1; x++) {
    for (const f of world.floraByCol[x]) {
      if (f.y < y0 - (f.len || 0) || f.y > y1 + (f.len || 0)) continue;
      const px = f.x * T - camIX, py = f.y * T - camIY;
      const pulse = f.glow ? 0.75 + 0.25 * Math.sin(time * 2 + f.phase) : 1;
      const cap = (f.variant & 1) ? PAL.capA : PAL.capB;

      if (f.type === 'grass') {
        // spring: pushed by the player wading through, oscillates back
        const overlap = player.x < (f.x + 1) * T && player.x + CFG.playerW > f.x * T &&
                        player.y + CFG.playerH > f.y * T + 4 && player.y < (f.y + 1) * T;
        if (overlap && Math.abs(player.vx) > 20) {
          f.bendVel = player.vx * 0.06;
        }
        f.bend += f.bendVel * dt;
        f.bendVel += (-f.bend * 45 - f.bendVel * 5.5) * dt;
        if (f.bend > 7) f.bend = 7; else if (f.bend < -7) f.bend = -7;
        const ambient = Math.sin(time * 1.3 + f.phase) * 0.8;
        const tip = f.bend + ambient;
        for (let b = 0; b < f.blades; b++) {
          const bx = px + 2 + ((f.variant >> (b * 3)) % 5) + b * 4;
          const bh = f.height - ((f.variant >> (b * 2)) % 3);
          g.fillStyle = lerpColor(PAL.mossA, PAL.mossB, ((f.variant >> b) % 8) / 8);
          g.fillRect(bx, py + T - (bh >> 1), 1, bh >> 1);          // rooted lower half
          g.fillRect(bx + tip * 0.5, py + T - bh, 1, bh - (bh >> 1)); // swaying upper half
          g.fillStyle = PAL.leaf;
          g.fillRect(bx + tip, py + T - bh - 1, 1, 2);             // tip
        }
      } else if (f.type === 'tramp') {
        if (f.springT > 0) f.springT = Math.max(0, f.springT - dt);
        const prog = 1 - f.springT / 0.35;
        const squish = f.springT > 0 ? 1 - 0.5 * Math.sin(prog * Math.PI) : 1;
        const cx3 = px + 8;
        const base = py + T;
        const capH = Math.round(10 * squish);
        const capY = base - 14 - capH;
        g.fillStyle = PAL.stem;                               // thick stem
        g.fillRect(cx3 - 3, base - 14, 6, 14);
        g.fillStyle = '#ff6fa8';                              // springy pink cap
        g.fillRect(cx3 - 20, capY, 40, capH);
        g.fillRect(cx3 - 14, capY - 2, 28, 2);
        g.fillStyle = '#ffffff';                              // polka dots
        g.fillRect(cx3 - 14 + (f.variant % 7), capY + 2, 3, 3);
        g.fillRect(cx3 + 2 + (f.variant % 9), capY + capH - 5, 3, 3);
        g.fillRect(cx3 - 6, capY - 1, 2, 2);
        g.fillStyle = '#d84a86';                              // underside
        g.fillRect(cx3 - 20, capY + capH - 1, 40, 1);
      } else if (f.type === 'cactus') {
        const ch = f.height;
        const cx2 = px + 6;
        g.fillStyle = '#3f6b2f';                              // trunk
        g.fillRect(cx2, py + T - ch, 5, ch);
        g.fillStyle = '#5c8f44';
        g.fillRect(cx2 + 1, py + T - ch, 2, ch);              // highlight rib
        g.fillStyle = '#e8f2c4';                              // needles
        g.fillRect(cx2 - 1, py + T - ch + 2 + (f.variant % 5), 1, 1);
        g.fillRect(cx2 + 5, py + T - ch + 5 + (f.variant % 4), 1, 1);
        if (f.arms && ch > 14) {                              // one arm each side
          g.fillStyle = '#3f6b2f';
          g.fillRect(cx2 - 4, py + T - ch + 5, 4, 3);
          g.fillRect(cx2 - 4, py + T - ch + 1, 3, 5);
          g.fillRect(cx2 + 5, py + T - ch + 8, 4, 3);
          g.fillRect(cx2 + 6, py + T - ch + 4, 3, 5);
        }
      } else if (f.type === 'mush') {
        const s = f.size;
        const stemH = Math.max(4, Math.round(10 * s));
        const stemW = s >= 1.5 ? 4 : 2;
        const capW = Math.round(Math.min(9 * s + 3, s >= 1.5 ? 28 : 14));
        const capH = Math.max(2, Math.round(3 * s));
        const topH = Math.max(1, Math.round(capH * 0.5));
        const cx = px + 8;
        const baseY = py + T; // rooted at the floor line
        g.fillStyle = PAL.stem;
        g.fillRect(cx - stemW / 2, baseY - stemH, stemW, stemH);
        g.globalAlpha = pulse;
        g.fillStyle = cap;
        const capY = baseY - stemH - capH;
        g.fillRect(cx - capW / 2, capY, capW, capH);
        g.fillRect(cx - Math.round(capW * 0.35), capY - topH, Math.round(capW * 0.7), topH);
        g.globalAlpha = 1;
        if (capW >= 10) { // gill dots on the bigger caps
          g.fillStyle = '#ffffff33';
          g.fillRect(cx - capW / 2 + 2 + (f.variant % (capW - 6)), capY + 1, 2, 2);
          if (capW >= 20) g.fillRect(cx + capW / 4, capY + capH - 2, 2, 2);
        }
      } else if (f.type === 'bigvine') {
        for (let k = 0; k < f.len; k++) {
          const sway = Math.sin(time * 0.9 + f.phase + k * 0.25) * 1.2 * k / f.len;
          const vx = px + 5 + sway;
          g.fillStyle = PAL.bigA;
          g.fillRect(vx, py + k * T, 6, T);
          g.fillStyle = PAL.bigB;
          g.fillRect(vx + 1, py + k * T, 2, T);
          g.fillStyle = PAL.leaf; // leaf pairs, alternating sides
          if (k % 2 === 0) g.fillRect(vx - 3, py + k * T + 4, 3, 2);
          else g.fillRect(vx + 6, py + k * T + 9, 3, 2);
          if (f.glow && k === ((f.len / 2) | 0)) {
            g.globalAlpha = pulse;
            g.fillStyle = PAL.vineGlow;
            g.fillRect(vx + 1, py + k * T + 6, 4, 4);
            g.globalAlpha = 1;
          }
        }
      } else if (f.type === 'vine') {
        for (let k = 0; k < f.len; k++) {
          const sway = Math.sin(time * 1.5 + f.phase + k * 0.5) * 1.5 * (k + 1) / f.len;
          const tip = k === f.len - 1;
          g.fillStyle = (tip && f.glow) ? PAL.vineGlow : PAL.vine;
          if (tip && f.glow) g.globalAlpha = pulse;
          g.fillRect(px + 6.5 + sway, py + k * T, 3, T);
          g.globalAlpha = 1;
          // leaf nubs
          if ((f.variant >> k) & 1) {
            g.fillStyle = PAL.vine;
            g.fillRect(px + 9.5 + sway, py + k * T + 5, 2, 2);
          } else {
            g.fillStyle = PAL.vine;
            g.fillRect(px + 4.5 + sway, py + k * T + 9, 2, 2);
          }
        }
      }
    }
  }
}

// =============================================================
// ENTRANCE — stone-framed doorway; its void stays black under any light
// =============================================================
const DOOR_STYLES = {
  black:  { inner: '#000000', rim: null /* theme doorRim */ },
  grey:   { inner: '#585862', rim: '#9a9aa4' },
  sand:   { inner: '#caa96b', rim: '#ffe8a0' },
  cactus: { inner: '#3f6b2f', rim: '#b06ce8' },
};

// =============================================================
// SPIKES — the cactus temple's hazard; they don't move, you do
// =============================================================
function hazardDeath() { // shared: crab bite, spike, needle, boss contact
  scorchFlash = 0.9;
  for (let i = 0; i < 10; i++) {
    spawnParticle({ type: 'splash', x: player.x + Math.random() * CFG.playerW, y: player.y + Math.random() * CFG.playerH, vx: (Math.random() - 0.5) * 120, vy: -50 - Math.random() * 70, life: 0.4 });
  }
  resetPlayer();
}

function updateSpikes() {
  if (transition || winState || !world.spikes.length) return;
  const p = player;
  for (const s of world.spikes) {
    const sx = s.x * T + 2, sy = s.y * T + 6;
    if (p.x < sx + 12 && p.x + CFG.playerW > sx && p.y < sy + 10 && p.y + CFG.playerH > sy) {
      hazardDeath();
      return;
    }
  }
}

// =============================================================
// GRASSHOPPERS — they hop, they bite, they never leave home
// =============================================================
function updateHoppers(dt, time) {
  const p = player;
  for (const h of world.hoppers) {
    if (h.dead) continue;
    if (h.squash > 0) {
      h.squash -= dt;
      if (h.squash <= 0) h.dead = true;
      continue;
    }
    if (!h.grounded) {
      h.vy += 1200 * dt;
      h.y += h.vy * dt;
      h.x += h.vx * dt;
      if (h.x < h.minX) { h.x = h.minX; h.vx = Math.abs(h.vx); }   // platform-bound for life
      if (h.x > h.maxX) { h.x = h.maxX; h.vx = -Math.abs(h.vx); }
      const ctx2 = Math.floor((h.x + 6) / T);
      if (h.vy < 0 && isSolid(ctx2, Math.floor(h.y / T))) {        // head bump
        h.y = (Math.floor(h.y / T) + 1) * T + 0.1;
        h.vy = 0;
      }
      const feetTy = Math.floor((h.y + 10) / T);
      if (h.vy > 0 && isSolid(ctx2, feetTy)) {                     // land
        h.y = feetTy * T - 10;
        h.vy = 0; h.vx = 0;
        h.grounded = true;
      }
    } else {
      h.t -= dt;
      if (h.t <= 0) { // hop!
        h.t = 1.2 + Math.random() * 1.4;
        h.dir = Math.random() < 0.5 ? -1 : 1;
        h.vy = CFG.hopperJumpVy;
        h.vx = h.dir * (30 + Math.random() * 55);
        h.grounded = false;
      }
    }
    // player contact — same law as crabs
    if (transition || winState) continue;
    const yOverlap = p.y < h.y + 10 && p.y + CFG.playerH > h.y;
    const overlap = yOverlap && p.x < h.x + 12 && p.x + CFG.playerW > h.x;
    const stompOverlap = yOverlap && p.x < h.x + 12 + CFG.crabStompPad &&
                         p.x + CFG.playerW > h.x - CFG.crabStompPad;
    if (p.vy > 60 && p.y + CFG.playerH < h.y + 7 && stompOverlap) {
      h.squash = 0.35;
      p.vy = CFG.crabBounce;
      continue;
    }
    if (!overlap) continue;
    if (p.dashTimer > 0) { h.squash = 0.35; continue; }
    hazardDeath();
    return;
  }
}

function drawHoppers(g, time, camIX, camIY) {
  for (const h of world.hoppers) {
    if (h.dead) continue;
    const sx = Math.round(h.x - camIX), sy = Math.round(h.y - camIY);
    if (sx < -20 || sx > CFG.VIEW_W + 20 || sy < -20 || sy > CFG.VIEW_H + 20) continue;
    if (h.squash > 0) {
      g.globalAlpha = h.squash / 0.35;
      g.fillStyle = '#4a8a2a';
      g.fillRect(sx, sy + 7, 12, 3);
      g.globalAlpha = 1;
      continue;
    }
    const air = !h.grounded;
    g.fillStyle = '#4a8a2a';                        // big rear legs
    if (air) { // legs kicked out
      g.fillRect(sx - 2, sy + 6, 4, 2);
      g.fillRect(sx + 10, sy + 6, 4, 2);
    } else {   // legs folded, ready
      g.fillRect(sx - 1, sy + 4, 3, 2);
      g.fillRect(sx - 2, sy + 6, 2, 4);
      g.fillRect(sx + 10, sy + 4, 3, 2);
      g.fillRect(sx + 12, sy + 6, 2, 4);
    }
    g.fillStyle = '#7dd44a';                        // body
    g.fillRect(sx, sy + 2, 12, 6);
    g.fillRect(sx + 2, sy, 8, 3);
    g.fillStyle = '#a8e87d';                        // belly stripe
    g.fillRect(sx + 1, sy + 6, 10, 1);
    g.fillStyle = '#2a4a16';                        // antennae
    g.fillRect(sx + (h.dir > 0 ? 10 : 0), sy - 3, 1, 3);
    g.fillRect(sx + (h.dir > 0 ? 12 : -2), sy - 4, 1, 3);
    g.fillStyle = '#ffffff';                        // eye
    g.fillRect(sx + (h.dir > 0 ? 8 : 2), sy + 1, 2, 2);
    g.fillStyle = '#1a2a0d';
    g.fillRect(sx + (h.dir > 0 ? 9 : 2), sy + 1, 1, 2);
  }
}

// =============================================================
// THE CACTUS KING — three hits fell it; until then, the way is barred
// =============================================================
const BOSS_W = 36, BOSS_H = 44;

function updateBoss(dt, time) {
  const b = world.boss, p = player;
  if (!b || b.dead) return;
  if (b.squash > 0) { // toppling
    b.squash -= dt;
    if (b.squash <= 0) { b.dead = true; cactusWin = { t: 0 }; }
    return;
  }
  b.inv = Math.max(0, b.inv - dt);
  b.x += b.dir * 26 * dt; // slow pace across the arena
  if (b.x < b.minX) { b.x = b.minX; b.dir = 1; }
  if (b.x > b.maxX) { b.x = b.maxX; b.dir = -1; }
  if (transition || winState) return;
  b.atk -= dt;
  if (b.atk <= 0) { // a needle, aimed at your height
    b.atk = 1.8;
    const dir2 = p.x + CFG.playerW / 2 < b.x + BOSS_W / 2 ? -1 : 1;
    world.needles.push({
      x: b.x + BOSS_W / 2 + dir2 * 24,
      y: Math.max(b.y + 6, Math.min(b.y + BOSS_H - 6, p.y + CFG.playerH / 2)),
      vx: dir2 * 150, life: 4,
    });
  }
  const overlap = p.x < b.x + BOSS_W && p.x + CFG.playerW > b.x &&
                  p.y < b.y + BOSS_H && p.y + CFG.playerH > b.y;
  if (!overlap || b.inv > 0) return; // grace frames cut both ways
  if (p.vy > 60 && p.y + CFG.playerH < b.y + BOSS_H * 0.5) { // stomped its crown
    bossHit(b);
    p.vy = -260;
  } else if (p.dashTimer > 0) { // dashed through its ribs
    bossHit(b);
  } else {
    hazardDeath();
  }
}

function bossHit(b) {
  b.hp--;
  b.inv = 0.9;
  for (let i = 0; i < 12; i++) {
    spawnParticle({ type: 'spore', hint: 0, x: b.x + Math.random() * BOSS_W, y: b.y + Math.random() * BOSS_H, vy: -20 - Math.random() * 30, phase: Math.random() * 6.3, size: 2, life: 0.9 });
  }
  if (b.hp <= 0) b.squash = 0.6;
}

function updateNeedles(dt) {
  const p = player;
  for (let i = world.needles.length - 1; i >= 0; i--) {
    const n = world.needles[i];
    n.x += n.vx * dt;
    n.life -= dt;
    if (n.life <= 0 || isSolid(Math.floor(n.x / T), Math.floor(n.y / T))) {
      world.needles.splice(i, 1);
      continue;
    }
    if (!transition && !winState &&
        p.x < n.x + 8 && p.x + CFG.playerW > n.x - 8 &&
        p.y < n.y + 2 && p.y + CFG.playerH > n.y - 2) {
      world.needles.splice(i, 1);
      hazardDeath();
    }
  }
}

function drawBoss(g, time, camIX, camIY) {
  const b = world.boss;
  if (b && !b.dead) {
    const sx = Math.round(b.x - camIX), sy = Math.round(b.y - camIY);
    if (sx > -60 && sx < CFG.VIEW_W + 60 && sy > -60 && sy < CFG.VIEW_H + 60) {
      if (b.squash > 0) { // topples into a heap
        g.globalAlpha = b.squash / 0.6;
        g.fillStyle = '#2f5424';
        g.fillRect(sx, sy + BOSS_H - 8, BOSS_W, 8);
        g.globalAlpha = 1;
      } else {
        g.fillStyle = '#3f6b2f';                               // body
        g.fillRect(sx, sy, BOSS_W, BOSS_H);
        g.fillStyle = '#5c8f44';                               // ribs
        g.fillRect(sx + 6, sy + 2, 4, BOSS_H - 2);
        g.fillRect(sx + BOSS_W - 10, sy + 2, 4, BOSS_H - 2);
        g.fillStyle = '#3f6b2f';                               // arms
        g.fillRect(sx - 8, sy + 12, 8, 6);
        g.fillRect(sx - 8, sy + 2, 6, 12);
        g.fillRect(sx + BOSS_W, sy + 16, 8, 6);
        g.fillRect(sx + BOSS_W + 2, sy + 6, 6, 12);
        g.fillStyle = '#e8f2c4';                               // needles
        g.fillRect(sx - 2, sy + 8, 2, 1);
        g.fillRect(sx + BOSS_W, sy + 24, 2, 1);
        g.fillStyle = '#ffd44a';                               // the crown
        g.fillRect(sx + 6, sy - 4, BOSS_W - 12, 4);
        g.fillRect(sx + 8, sy - 8, 4, 4);
        g.fillRect(sx + 16, sy - 9, 4, 5);
        g.fillRect(sx + 24, sy - 8, 4, 4);
        const ex = b.dir > 0 ? 2 : 0;                          // angry eyes
        g.fillStyle = '#ffffff';
        g.fillRect(sx + 10, sy + 12, 5, 5);
        g.fillRect(sx + 22, sy + 12, 5, 5);
        g.fillStyle = '#1e3a16';
        g.fillRect(sx + 11 + ex, sy + 14, 2, 3);
        g.fillRect(sx + 23 + ex, sy + 14, 2, 3);
        g.fillRect(sx + 9, sy + 10, 7, 2);                     // brows
        g.fillRect(sx + 21, sy + 10, 7, 2);
        if (b.inv > 0 && Math.sin(time * 30) > 0) {            // hit flash
          g.globalAlpha = 0.5;
          g.fillStyle = '#ffffff';
          g.fillRect(sx, sy, BOSS_W, BOSS_H);
          g.globalAlpha = 1;
        }
        for (let i = 0; i < b.hp; i++) {                       // health pips
          g.fillStyle = '#b8e84a';
          g.fillRect(sx + 4 + i * 10, sy - 16, 7, 5);
        }
      }
    }
  }
  g.fillStyle = '#e8f2c4';
  for (const n of world.needles) {
    const nx = Math.round(n.x - camIX), ny = Math.round(n.y - camIY);
    g.fillRect(nx - 6, ny - 1, 12, 2);
  }
}

function drawSpikes(g, camIX, camIY) {
  for (const s of world.spikes) {
    const px = s.x * T - camIX, py = s.y * T - camIY;
    if (px < -20 || px > CFG.VIEW_W + 20 || py < -20 || py > CFG.VIEW_H + 20) continue;
    for (let k = 0; k < 3; k++) { // three needle pyramids per tile
      const bx = px + 1 + k * 5;
      g.fillStyle = '#2f5424';
      g.fillRect(bx, py + 12, 5, 4);
      g.fillStyle = '#4a7a38';
      g.fillRect(bx + 1, py + 8, 3, 4);
      g.fillStyle = '#e8f2c4';
      g.fillRect(bx + 2, py + 5, 1, 3);
    }
  }
}

function doorRect(d, camIX, camIY) {
  const px = d.x * T - camIX, py = (d.y - 2) * T - camIY; // top-left of the 2x3 opening
  if (px < -80 || px > CFG.VIEW_W + 80 || py < -96 || py > CFG.VIEW_H + 96) return null;
  return { px, py, w: 2 * T, h: 3 * T };
}

function drawDoorArch(g, r, inner) {
  g.fillStyle = inner;
  g.fillRect(r.px, r.py + 6, r.w, r.h - 6);
  g.fillRect(r.px + 3, r.py + 2, r.w - 6, 4);
}

function drawEntranceFrame(g, camIX, camIY) {
  for (const d of world.doors || []) {
    const r = doorRect(d, camIX, camIY);
    if (!r) continue;
    const st = DOOR_STYLES[d.kind] || DOOR_STYLES.black;
    const { px, py, w, h } = r;
    if (d.kind === 'cactus') { // the great cactus: vast, purple-rimmed, hollow
      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 350);
      g.globalAlpha = pulse;
      g.fillStyle = '#b06ce8';                       // purple outline
      g.fillRect(px - 4, py - 16, w + 8, h + 16);
      g.globalAlpha = 1;
      g.fillStyle = '#3f6b2f';                       // body
      g.fillRect(px - 2, py - 14, w + 4, h + 14);
      g.fillStyle = '#5c8f44';                       // ribs
      g.fillRect(px + 3, py - 12, 3, h + 12);
      g.fillRect(px + w - 6, py - 12, 3, h + 12);
      g.fillStyle = '#3f6b2f';                       // arms
      g.fillRect(px - 10, py - 2, 8, 5);
      g.fillRect(px - 10, py - 10, 5, 10);
      g.fillRect(px + w + 2, py + 4, 8, 5);
      g.fillRect(px + w + 5, py - 6, 5, 12);
      g.fillStyle = '#e8f2c4';                       // needles
      g.fillRect(px + 1, py - 8, 1, 2);
      g.fillRect(px + w - 2, py - 4, 1, 2);
      g.fillStyle = '#1e3a16';                       // the hollow
      g.fillRect(px + 5, py + 10, w - 10, h - 10);
      continue;
    }
    g.fillStyle = PAL.stoneDeep;                    // rock surround
    g.fillRect(px - 4, py - 6, w + 8, h + 6);
    g.fillStyle = PAL.topHi;                        // lintel highlight + moss
    g.fillRect(px - 4, py - 6, w + 8, 2);
    g.fillStyle = d.kind === 'grey' ? '#7a7a84' : PAL.mossA;
    g.fillRect(px - 4, py - 5, w + 8, 3);
    g.fillStyle = st.rim || PAL.doorRim;            // rim
    g.fillRect(px - 1, py + 5, 1, h - 5);
    g.fillRect(px + w, py + 5, 1, h - 5);
    g.fillRect(px + 2, py + 1, w - 4, 1);
    drawDoorArch(g, r, st.inner);
    if (d.kind === 'grey') {                        // panel seams on the grey door
      g.fillStyle = '#3f3f48';
      g.fillRect(px + w / 2, py + 6, 1, h - 6);
      g.fillRect(px + 3, py + h / 2, w - 6, 1);
    }
  }
}

// the black door's void swallows even the player's light — redrawn above the darkness
function drawEntranceVoid(g, camIX, camIY) {
  for (const d of world.doors || []) {
    if (d.kind !== 'black') continue;
    const r = doorRect(d, camIX, camIY);
    if (r) drawDoorArch(g, r, '#000000');
  }
}

// spores drift off glowing flora that's on screen
function emitSpores(camIX, camIY) {
  if (particles.length >= CFG.maxParticles - 20) return;
  const x0 = Math.max(0, (camIX / T | 0) - 2);
  const x1 = Math.min(W - 1, ((camIX + CFG.VIEW_W) / T | 0) + 2);
  for (let x = x0; x <= x1; x++) {
    for (const f of world.floraByCol[x]) {
      if (!f.glow || Math.random() >= CFG.sporeChance) continue;
      const fy = f.type === 'vine' ? f.y + f.len - 1 :
                 f.type === 'bigvine' ? f.y + ((f.len / 2) | 0) : f.y;
      // near the door, spores turn violet and drift toward it
      let hint = 0;
      const e = world.entrance;
      if (e) {
        const dd = Math.hypot(f.x - e.x, fy - e.y);
        if (dd < CFG.hintRadius && dd > 3) hint = Math.sign(e.x - f.x);
      }
      spawnParticle({
        type: 'spore', hint,
        x: f.x * T + 4 + Math.random() * 8,
        y: fy * T + 4 + Math.random() * 8,
        vy: (PAL.sporeRise ? -1 : 1) * (6 + Math.random() * 6), // embers rise

        phase: Math.random() * Math.PI * 2,
        size: Math.random() < 0.5 ? 1 : 2,
        life: 6 + Math.random() * 4,
      });
    }
  }
}

// =============================================================
// LIGHTING OVERLAY
// =============================================================
const LW = 64, LH = 38;
const lightCanvas = document.createElement('canvas');
lightCanvas.width = LW; lightCanvas.height = LH;
const lightCtx = lightCanvas.getContext('2d');
const lightData = lightCtx.createImageData(LW, LH);

function drawLighting(g, camIX, camIY) {
  const baseX = (camIX / T | 0) - 1;
  const baseY = (camIY / T | 0) - 1;
  const pcx = (player.x + CFG.playerW / 2) / T;
  const pcy = (player.y + CFG.playerH / 2) / T;
  const d = lightData.data;

  for (let j = 0; j < LH; j++) {
    const ty = baseY + j;
    for (let i = 0; i < LW; i++) {
      const tx = baseX + i;
      let l = 0;
      let solid = true;
      if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
        l = world.staticLight[ty * W + tx];
        solid = world.tiles[ty * W + tx] === STONE;
      }
      const dx = tx + 0.5 - pcx, dy = ty + 0.5 - pcy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const pl = CFG.playerLight - dist * CFG.playerLightFalloff - (solid ? 2 : 0);
      if (pl > l) l = pl;
      if (l < (PAL.ambient || 0) && !solid) l = PAL.ambient; // daylight floor
      if (l > 15) l = 15; else if (l < 0) l = 0;
      const a = Math.pow(1 - l / 15, CFG.darknessExp) * (PAL.darkMax ?? CFG.darknessMax);
      const o = (j * LW + i) * 4;
      d[o] = PAL.darkR; d[o + 1] = 0; d[o + 2] = PAL.darkB; d[o + 3] = a;
    }
  }
  lightCtx.putImageData(lightData, 0, 0);

  g.imageSmoothingEnabled = true;
  g.drawImage(lightCanvas, 0, 0, LW, LH,
    baseX * T - camIX, baseY * T - camIY, LW * T, LH * T);
  g.imageSmoothingEnabled = false;

  // warm torch-glow around the player
  const psx = player.x + CFG.playerW / 2 - camIX;
  const psy = player.y + CFG.playerH / 2 - camIY;
  const grad = g.createRadialGradient(psx, psy, 8, psx, psy, 110);
  grad.addColorStop(0, 'rgba(255,233,196,0.07)');
  grad.addColorStop(1, 'rgba(255,233,196,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = grad;
  g.fillRect(psx - 110, psy - 110, 220, 220);
  g.globalCompositeOperation = 'source-over';
}

// =============================================================
// INPUT
// =============================================================
const keys = new Set();
const justPressed = new Set();

window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) {
    if (gameState === 'menu') {
      if (menuScreen === 'help') {
        if (['Space', 'Enter', 'Escape'].includes(e.code)) menuScreen = 'main';
        return;
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') {
        menuIndex = (menuIndex + 1) % MENU_ITEMS.length;
      } else if (e.code === 'Space' || e.code === 'Enter') {
        if (menuIndex === 0) { startNewRun(); gameState = 'play'; }
        else menuScreen = 'help';
      }
      return;
    }
    if (cactusWin) {
      if (e.code === 'Space' || e.code === 'Enter') cactusWin = null;
      return;
    }
    if (winState) {
      if (e.code === 'Space' || e.code === 'Enter') startNewRun();
      else if (e.code === 'Escape') { winState = null; gameState = 'menu'; menuScreen = 'main'; menuIndex = 0; }
      return;
    }
    if (e.code === 'Escape') { // abandon the run, back to the menu
      gameState = 'menu'; menuScreen = 'main'; menuIndex = 0;
      transition = null; showMap = false;
      keys.clear();
      return;
    }
    justPressed.add(e.code);
    if (e.code === 'KeyR' && !transition) {
      levelSeeds[currentLevel] = (Math.random() * 0x7fffffff) | 0;
      generateWorld(levelSeeds[currentLevel], currentLevel);
      resetPlayer();
      particles.length = 0;
    }
    if (e.code === 'Backquote') debugHud = !debugHud;
    if (e.code === 'KeyM') showMap = !showMap;
    if (e.code === 'KeyL') hatOn = !hatOn;
  }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

// =============================================================
// HUD
// =============================================================
let debugHud = false;
let fps = 0, fpsFrames = 0, fpsTime = 0;

function drawHud(g) {
  g.font = '11px monospace';
  g.textBaseline = 'top';
  g.fillStyle = 'rgba(200,230,215,0.55)';
  g.fillText(`${PAL.name.toLowerCase()} · seed ${world.seed}`, 8, 8);
  g.fillText(fmtTime((performance.now() - runStart) / 1000), CFG.VIEW_W - 62, 8);
  if (world.key) {
    g.fillStyle = world.key.taken ? '#ffd44a' : 'rgba(200,230,215,0.45)';
    g.fillText(world.key.taken ? 'key found' : 'the door needs a key', 8, 22);
  }
  if (doorMsg.t > 0) {
    g.textAlign = 'center';
    g.globalAlpha = Math.min(1, doorMsg.t / 0.4);
    g.font = 'bold 15px monospace';
    g.fillStyle = '#ffd44a';
    g.fillText(doorMsg.text, CFG.VIEW_W / 2, 120);
    g.globalAlpha = 1;
    g.textAlign = 'left';
    g.font = '11px monospace';
  }
  g.fillText('A/D move · Space jump · Shift dash · M map · L hat · R new cave · ` debug', 8, CFG.VIEW_H - 18);

  if (debugHud) {
    const tx = (player.x + CFG.playerW / 2) / T | 0;
    const ty = (player.y + CFG.playerH / 2) / T | 0;
    const l = (tx >= 0 && tx < W && ty >= 0 && ty < H) ? world.staticLight[ty * W + tx] : 0;
    g.fillStyle = 'rgba(150,255,180,0.8)';
    g.fillText(`fps ${fps}  tile ${tx},${ty}  light ${l}  particles ${particles.length}`, 8, 22);
  }
}

// =============================================================
// MAIN LOOP
// =============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

generateWorld(levelSeeds[1], 1);
resetPlayer();

let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  const time = now / 1000;

  // fps
  fpsFrames++;
  if (time - fpsTime >= 1) { fps = fpsFrames; fpsFrames = 0; fpsTime = time; }

  // ---- update ----
  if (gameState === 'menu') {
    // slow drifting pan across the cave behind the menu
    const t2 = time * 0.07;
    cam.x = world.spawn.x * T - CFG.VIEW_W / 2 + Math.sin(t2) * 320;
    cam.y = world.spawn.y * T - CFG.VIEW_H / 2 + Math.cos(t2 * 0.7) * 160;
    clampCam();
  } else if (cactusWin) {
    cactusWin.t += dt; // the fall of the king holds the moment
  } else if (!winState) {
    if (!transition || transition.phase !== 'out') updatePlayer(dt);
    updateWaterfall(dt);
    updateVolcano(dt);
    updateBombs(dt);
    updateCrabs(dt, time);
    updateHoppers(dt, time);
    updateSpikes();
    updateBoss(dt, time);
    updateNeedles(dt);
    updateKey(time);
    doorMsg.t = Math.max(0, doorMsg.t - dt);
    checkDoor();
    updateTransition(dt);
    updateCamera(dt);
  }
  const camIX = Math.round(cam.x), camIY = Math.round(cam.y);
  updateParticles(dt, time, camIX, camIY);
  emitSpores(camIX, camIY);

  // ---- render ----
  const g = ctx;

  // 1. background gradient + parallax silhouettes
  g.drawImage(bgCanvas, 0, 0);
  const pox = -((camIX * 0.4) % CFG.VIEW_W), poy = -((camIY * 0.4) % CFG.VIEW_H);
  g.globalAlpha = 0.6;
  g.drawImage(blobCanvas, pox, poy);
  g.drawImage(blobCanvas, pox + CFG.VIEW_W, poy);
  g.drawImage(blobCanvas, pox, poy + CFG.VIEW_H);
  g.drawImage(blobCanvas, pox + CFG.VIEW_W, poy + CFG.VIEW_H);
  g.globalAlpha = 1;

  // 2. terrain — one drawImage of the prebaked world
  g.drawImage(world.terrainCanvas, camIX, camIY, CFG.VIEW_W, CFG.VIEW_H, 0, 0, CFG.VIEW_W, CFG.VIEW_H);

  // 3. water animation: shimmering tint + displaced surface line
  const wx0 = camIX / T | 0, wx1 = (camIX + CFG.VIEW_W) / T | 0;
  const wy0 = camIY / T | 0, wy1 = (camIY + CFG.VIEW_H) / T | 0;
  for (let ty = wy0; ty <= wy1; ty++) {
    if (ty < 0 || ty >= H) continue;
    for (let tx = wx0; tx <= wx1; tx++) {
      if (tx < 0 || tx >= W || world.tiles[ty * W + tx] !== WATER) continue;
      g.globalAlpha = 0.15 + 0.05 * Math.sin(time + tx);
      g.fillStyle = PAL.waterTint;
      g.fillRect(tx * T - camIX, ty * T - camIY, T, T);
      if (ty > 0 && world.tiles[(ty - 1) * W + tx] === AIR) {
        g.globalAlpha = 0.9;
        g.fillStyle = PAL.waterLine;
        const dy = Math.sin(time * 2 + tx * 0.8) * 1.5;
        g.fillRect(tx * T - camIX, ty * T - camIY + dy, T, 2);
      }
    }
  }
  g.globalAlpha = 1;

  // 3.5 the waterfall pours behind everything that moves
  drawWaterfall(g, time, camIX, camIY);

  // 4. entrance, then flora
  drawEntranceFrame(g, camIX, camIY);
  drawFlora(g, time, dt, camIX, camIY);

  // 4.5 spikes, crabs and the king, then the player
  drawSpikes(g, camIX, camIY);
  drawCrabs(g, time, camIX, camIY);
  drawHoppers(g, time, camIX, camIY);
  drawBoss(g, time, camIX, camIY);

  // 5. player
  {
    const sx = Math.round(player.x - camIX), sy = Math.round(player.y - camIY);
    const bob = (player.moving && player.onGround) ? Math.sin(time * 14) * 1.5 : 0;
    g.fillStyle = PAL.body;
    g.fillRect(sx, sy, CFG.playerW, 14);                       // body
    g.fillRect(sx + 1, sy + 14, 4, 8 + (bob > 0 ? -1 : 0));    // legs
    g.fillRect(sx + 7, sy + 14, 4, 8 + (bob < 0 ? -1 : 0));
    g.fillStyle = '#2b2b33';                                   // eyes
    const ex = player.facing > 0 ? sx + 7 : sx + 3;
    g.fillRect(ex, sy + 3, 2, 2);
    if (player.hanging) {                                      // arm over the lip
      g.fillStyle = PAL.body;
      const ax = player.hangDir > 0 ? sx + CFG.playerW - 1 : sx - 3;
      g.fillRect(ax, sy - 2, 4, 3);
    }
    if (hatOn) {                                               // the mushroom hat
      const hb = Math.round(bob * 0.5);
      g.fillStyle = PAL.stem;
      g.fillRect(sx + 2, sy - 2 + hb, 8, 2);                   // brim seat
      g.fillStyle = PAL.capA;
      g.fillRect(sx - 1, sy - 5 + hb, 14, 3);                  // cap
      g.fillRect(sx + 1, sy - 7 + hb, 10, 2);
      g.fillStyle = '#ffffff55';                               // speckles
      g.fillRect(sx + 3, sy - 6 + hb, 2, 1);
      g.fillRect(sx + 8, sy - 4 + hb, 2, 1);
    }
    g.fillStyle = '#c9b382';                                   // belly shade
    g.fillRect(sx, sy + 10, CFG.playerW, 2);
  }

  // 6. water-y particles (lit normally, under the darkness)
  drawParticles(g, camIX, camIY, false);

  // 7. lighting overlay + warm glow
  drawLighting(g, camIX, camIY);

  // 8. the entrance void swallows even the player's light; spores and the key glint above the dark
  drawEntranceVoid(g, camIX, camIY);
  drawKey(g, time, camIX, camIY);
  drawBombs(g, camIX, camIY);
  drawParticles(g, camIX, camIY, true);

  // 9. HUD, lava warning/scorch, level transition fade
  if (player.lavaTime > 0.3) { // rising red vignette while lava cooks you
    const wa = Math.pow(player.lavaTime / CFG.lavaMaxTime, 2) * 0.4;
    g.fillStyle = `rgba(255,60,10,${wa.toFixed(3)})`;
    g.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H);
  }
  if (scorchFlash > 0) {
    scorchFlash = Math.max(0, scorchFlash - dt);
    // fully red for the first beat, then a fading pulse
    const a = scorchFlash > 0.6 ? 1 : Math.pow(scorchFlash / 0.6, 1.2);
    g.fillStyle = `rgba(255,14,6,${a.toFixed(3)})`;
    g.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H);
  }
  if (gameState === 'menu') {
    drawMenu(g, time);
  } else {
    drawHud(g);
    drawMap(g, time);
    drawCactusWin(g, time);
    drawTransition(g);
    drawWin(g, time);
  }

  justPressed.clear();
}
requestAnimationFrame(frame);
</script>
</body>
